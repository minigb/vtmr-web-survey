<!doctype html>
<html>
<head>
  <title>VTMR Web Survey</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1200px; margin: 50px auto; text-align: center; }
    #survey-container { margin-bottom: 20px; }
    #video-container { display: flex; justify-content: space-around; margin-bottom: 20px; }
    video { width: 80%; border: 1px solid #ccc; }
    .choice-btn { padding: 15px 30px; margin: 10px; font-size: 16px; cursor: pointer; border-radius: 5px; border: 2px solid transparent; }
    .choice-btn.selected { border-color: #007bff; }
    #previous-pair, #next-pair { padding: 8px 15px; font-size: 12px; margin-top: 10px; }
    #submit-survey { padding: 15px 30px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    #progress-container { margin-top: 20px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>🎵 Video-to-Music Retrieval Survey</h1>

  <div id="welcome-container">
    <h2>Welcome to the Survey</h2>
    <p>Please enter your participant ID to begin.</p>
    <input type="text" id="user-id" placeholder="Enter your ID">
    <button id="start-survey">Start Survey</button>
  </div>

  <div id="survey-container" class="hidden">
    <div id="video-container">
      <div>
        <h3>Option A</h3>
        <video id="video-a" controls></video>
      </div>
      <div>
        <h3>Option B</h3>
        <video id="video-b" controls></video>
      </div>
    </div>
    <button id="vote-a" class="choice-btn">Choose A</button>
    <button id="vote-b" class="choice-btn">Choose B</button>
    <div id="navigation-container" style="margin-top: 20px;">
      <button id="previous-pair">Previous</button>
      <button id="next-pair">Next</button>
      <button id="submit-survey" class="hidden">Submit</button>
    </div>
    <div id="progress-container">
      <p id="progress-text"></p>
    </div>
  </div>

  <div id="thank-you" class="hidden">
    <h2>Thank you for completing the survey!</h2>
    <p>Your responses have been recorded.</p>
  </div>

  <script>
    let allPairs = [];
    let userChoices = [];
    let currentPairIndex = 0;
    let userId = '';

    const welcomeContainer = document.getElementById('welcome-container');
    const userIdInput = document.getElementById('user-id');
    const startSurveyBtn = document.getElementById('start-survey');
    const surveyContainer = document.getElementById('survey-container');
    const videoA = document.getElementById('video-a');
    const videoB = document.getElementById('video-b');
    const voteA_btn = document.getElementById('vote-a');
    const voteB_btn = document.getElementById('vote-b');
    const previousPairBtn = document.getElementById('previous-pair');
    const nextPairBtn = document.getElementById('next-pair');
    const submitSurveyBtn = document.getElementById('submit-survey');
    const progressText = document.getElementById('progress-text');
    const thankYou = document.getElementById('thank-you');

    // Start Survey
    startSurveyBtn.addEventListener('click', async () => {
      userId = userIdInput.value.trim();
      if (!userId) {
        alert('Please enter a participant ID.');
        return;
      }

      // Check for duplicate ID
      const res = await fetch(`/api/check-user/${userId}`);
      const { exists } = await res.json();
      if (exists) {
        alert('This participant ID has already been used. Please enter a unique ID.');
        return;
      }

      welcomeContainer.classList.add('hidden');
      loadSurvey();
    });

    // Fetch all pairs on load
    async function loadSurvey() {
      const res = await fetch('/api/all-pairs');
      allPairs = await res.json();
      if (allPairs.length > 0) {
        userChoices = new Array(allPairs.length).fill(null);
        surveyContainer.classList.remove('hidden');
        loadPair();
      } else {
        surveyContainer.innerHTML = '<h2>No survey pairs found.</h2>';
      }
    }

    function updateSelectionStyle() {
      // Reset button styles
      voteA_btn.classList.remove('selected');
      voteB_btn.classList.remove('selected');

      // Highlight selected choice if it exists
      const currentChoice = userChoices[currentPairIndex];
      if (currentChoice === 'A') {
        voteA_btn.classList.add('selected');
      } else if (currentChoice === 'B') {
        voteB_btn.classList.add('selected');
      }
    }

    function loadPair() {
      // Update button states
      previousPairBtn.disabled = currentPairIndex === 0;
      nextPairBtn.disabled = currentPairIndex === allPairs.length - 1;
      submitSurveyBtn.classList.toggle('hidden', currentPairIndex !== allPairs.length - 1);

      updateSelectionStyle();

      const pair = allPairs[currentPairIndex];
      // Use anonymous video API endpoints
      videoA.src = `/api/video/${pair[0].file}`;
      videoB.src = `/api/video/${pair[1].file}`;
      progressText.textContent = `Progress: ${currentPairIndex + 1} / ${allPairs.length}`;
    }

    function recordChoice(choice) {
      userChoices[currentPairIndex] = choice;
      updateSelectionStyle(); // Only update the style, don't reload the pair
    }

    voteA_btn.addEventListener('click', () => recordChoice('A'));
    voteB_btn.addEventListener('click', () => recordChoice('B'));

    previousPairBtn.addEventListener('click', () => {
      if (currentPairIndex > 0) {
        currentPairIndex--;
        loadPair();
      }
    });

    nextPairBtn.addEventListener('click', () => {
      if (currentPairIndex < allPairs.length - 1) {
        currentPairIndex++;
        loadPair();
      }
    });

    submitSurveyBtn.addEventListener('click', async () => {
      const votes = allPairs.map((pair, index) => ({
        pair,
        choice: userChoices[index],
        winner: userChoices[index] === 'A' ? pair[0] : pair[1],
        loser: userChoices[index] === 'A' ? pair[1] : pair[0],
        ts: new Date().toISOString()
      })).filter(vote => vote.choice !== null); // Filter out any unanswered pairs

      if (votes.length < allPairs.length) {
        alert('Please answer all questions before submitting.');
        return;
      }

      await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, votes })
      });

      surveyContainer.classList.add('hidden');
      thankYou.classList.remove('hidden');
    });

  </script>
</body>
</html>
